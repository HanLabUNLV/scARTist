name: scARTist-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.1
  # CRAN
  - r-dplyr
  - r-tidyr
  - r-stringr
  - r-gtools
  - r-copula
  - r-fastglm
  - r-tictoc
  # Bioconductor
  - bioconductor-biomart
  # scDesign2 is not on bioconda; install from GitHub in a post-deploy step:
  #   Rscript -e 'remotes::install_github("JSB-UCLA/scDesign2")'
  - r-remotes
