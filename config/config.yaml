# scARTist configuration
# All paths and parameters that were hardcoded in the original scripts now live here.
# Every path may be absolute or relative to the directory Snakemake is launched from.
#
# Reference DATA lives OUTSIDE the scARTist tree (large, shared, not code) under
# the data dir below. The container (resources/art.sif) is a TOOL and stays in
# the tree. Point the paths below at wherever the data dir was placed.

# ----------------------------------------------------------------------------
# Reference inputs the user must supply (see docs/inputs.md)
# Data dir: /mnt/data1/home/mirahan/scRNAsim/data
# ----------------------------------------------------------------------------
inputs:
  # Real single-cell isoform/transcript count matrix that scDesign2 is fit to.
  # Rows = pipe-delimited GENCODE transcript headers; columns = cells.
  real_count_matrix: "/mnt/data1/home/mirahan/scRNAsim/data/Bcell.NumReads.filtered.rowsum55.protein.txt"

  # rMATS event->exon->transcript map. Used ONLY to flag rMATS-detectable
  # features when choosing differential-splicing genes. This file is a product
  # of the separate benchmarking project; here it is a fixed input.
  mapped_events: "/mnt/data1/home/mirahan/scRNAsim/data/Mapped.EventsToExons.txt"

  # GENCODE transcript sequences as a 2-column tab file (header, sequence),
  # produced by: seqkit fx2tab gencode.v34.transcripts.fa > gencode.v34.transcripts.tab
  gencode_transcripts_tab: "/mnt/data1/home/mirahan/scRNAsim/data/gencode.v34.transcripts.tab"

  # Illumina quality profiles for art_modern (R1 / R2).
  qual_profile_r1: "/mnt/data1/home/mirahan/scRNAsim/data/HiSeq2500L125R1.txt"
  qual_profile_r2: "/mnt/data1/home/mirahan/scRNAsim/data/HiSeq2500L125R2.txt"

  # RSEM reference prefix (the files <prefix>.grp, <prefix>.ti, <prefix>.seq, ...
  # produced by rsem-prepare-reference). Used by rsem-tbam2gbam.
  rsem_reference_prefix: "/mnt/data1/home/mirahan/scRNAsim/data/rsem_reference/Homo_sapiens.GRCh38.v34"

# ----------------------------------------------------------------------------
# Container (art_modern + samtools + rsem-tbam2gbam + seqkit)
# ----------------------------------------------------------------------------
container:
  # Path to the prebuilt Singularity/Apptainer image, or build it from
  # containers/art.def (see docs/installation.md).
  sif: "resources/art.sif"
  # Extra bind mounts passed to `singularity exec --bind` (comma-separated),
  # e.g. the storage root that holds your inputs/outputs. Bind the project root
  # so the container sees the sibling data/ dir (RSEM reference) and results/.
  bind: "/mnt/data1/home/mirahan/scRNAsim"

# ----------------------------------------------------------------------------
# scDesign2 model-fit parameters (Stage 1, run once)
# ----------------------------------------------------------------------------
model:
  seed: 123
  cell_type: "Bcell"          # label used inside scDesign2 fit/simulate
  marginal: "nb"              # negative-binomial marginals
  read_len: 50                # used only for effective-length (length - read_len + 1)
  nbr_diff_expr: 1000         # number of genes given a DE fold change
  nbr_diff_spliced: 1000      # number of genes given differential transcript usage
  fit_ncores: 20              # ncores passed to fit_model_scDesign2

# ----------------------------------------------------------------------------
# Simulation sweep grid (Stage 2). Full cross-product is simulated.
# ----------------------------------------------------------------------------
sweep:
  read_depths: [10000000, 41000000, 83000000]   # total_count_new per config
  n_cells: [80, 150]
  arms: ["null", "deds"]      # null = no signal; deds = DE + differential splicing

# ----------------------------------------------------------------------------
# art_modern read-simulation parameters (Stage 4, per cell)
# ----------------------------------------------------------------------------
reads:
  read_len: 125
  fcov: 10                    # per-transcript fold coverage (--i-fcov)
  pe_frag_dist_mean: 300
  pe_frag_dist_std_dev: 50
  art_threads: 4              # --parallel for art_modern and -@ for samtools
  rsem_threads: 4             # -p for rsem-tbam2gbam
